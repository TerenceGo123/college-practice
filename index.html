<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Калькулятор Мечты</title>
</head>
<body>
   <div class="calculator">
        <div class="calc-menu">
            <button class="menu-btn active" onclick="switchMode('calc')">Кальк.</button>
            <button class="menu-btn" onclick="switchMode('currency')">Валюта</button>
            <button class="menu-btn" onclick="switchMode('weight')">Масса</button>
            <button class="menu-btn" onclick="switchMode('time')">Время</button>
        </div>

        <div id="calc-mode" class="mode-content active">
            <div class="display-container">
                <div id="expression-preview"></div>
                <input type="text" id="display" placeholder="0" readonly>
            </div>
            <div class="buttons">
                <button class="func" onclick="clearDisplay()">AC</button>
                <button class="func" onclick="deleteLast()">DEL</button>
                <button class="func" onclick="clearHistory()">Reset</button>
                <button class="operator" onclick="appendValue('/')">÷</button>
                
                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('*')">×</button>
                
                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('-')">−</button>
                
                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>
                
                <button class="zero" onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button class="equal" onclick="calculate()">=</button>
            </div>
            <div class="history-section">
                <ul id="historyList"></ul>
            </div>
        </div>

        <div id="currency-mode" class="mode-content">
            <div class="converter-box">
                <h3>Конвертер валют</h3>
                <input type="number" id="curr-amount" placeholder="Введите сумму" oninput="convertCurrency()">
                <div class="select-group">
                    <select id="curr-from" onchange="convertCurrency()">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="RUB" selected>RUB</option>
                    </select>
                    <span>➔</span>
                    <select id="curr-to" onchange="convertCurrency()">
                        <option value="USD" selected>USD</option>
                        <option value="EUR">EUR</option>
                        <option value="RUB">RUB</option>
                    </select>
                </div>
                <div class="conv-result" id="curr-result">0.00</div>
            </div>
        </div>

        <div id="weight-mode" class="mode-content">
            <div class="converter-box">
                <h3>Конвертер массы</h3>
                <input type="number" id="weight-amount" placeholder="Введите значение" oninput="convertWeight()">
                <div class="select-group">
                    <select id="weight-from" onchange="convertWeight()">
                        <option value="kg" selected>кг</option>
                        <option value="g">г</option>
                        <option value="lb">фунты</option>
                    </select>
                    <span>➔</span>
                    <select id="weight-to" onchange="convertWeight()">
                        <option value="kg">кг</option>
                        <option value="g" selected>г</option>
                        <option value="lb">фунты</option>
                    </select>
                </div>
                <div class="conv-result" id="weight-result">0.00</div>
            </div>
        </div>

        <div id="time-mode" class="mode-content">
            <div class="converter-box">
                <h3>Конвертер времени</h3>
                <input type="number" id="time-amount" placeholder="Введите значение" oninput="convertTime()">
                <div class="select-group">
                    <select id="time-from" onchange="convertTime()">
                        <option value="sec">сек</option>
                        <option value="min" selected>мин</option>
                        <option value="hr">час</option>
                    </select>
                    <span>➔</span>
                    <select id="time-to" onchange="convertTime()">
                        <option value="sec" selected>сек</option>
                        <option value="min">мин</option>
                        <option value="hr">час</option>
                    </select>
                </div>
                <div class="conv-result" id="time-result">0.00</div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
